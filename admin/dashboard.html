<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard · Parroquia Santa Teresa de Jesús</title>
    <script>
        /* Un solo panel: el dashboard vive dentro de /admin/. Si se abre suelto, se lleva allí. */
        if (window.top === window) location.replace("/admin/?panel=" + ((location.hash || "#tareas").slice(1) || "tareas"));
        else document.documentElement.classList.add("embed");
    </script>
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
    <style>
        :root { --bg: #f4eee3; --card: #fffdf8; --ink: #1d1a16; --muted: #857a68; --gold: #bfa065; --gold-d: #8f7340; --line: #e6dac2; --wine: #8c2f2f; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
        button, input, select, textarea { font: inherit; }
        header { position: sticky; top: 0; z-index: 20; background: #1b1610; color: #f0d79a; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
        .top { display: flex; align-items: center; gap: 1rem; padding: .9rem clamp(1rem, 4vw, 2.5rem) .5rem; }
        .top svg { width: 22px; height: 30px; flex-shrink: 0; }
        .top h1 { margin: 0; font: italic 400 1.35rem/1.2 Georgia, "Times New Roman", serif; color: #fff; }
        .top small { display: block; font-size: .66rem; letter-spacing: 2.5px; text-transform: uppercase; color: #bfa065; }
        .top .me { margin-left: auto; display: flex; align-items: center; gap: .6rem; font-size: .85rem; color: #e9dcc0; }
        .top .me img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
        .top a.back { color: #f0d79a; font-size: .82rem; text-decoration: none; border: 1px solid rgba(240,215,154,.4); padding: .4rem .85rem; border-radius: 20px; white-space: nowrap; }
        nav.tabs { display: flex; gap: .3rem; padding: 0 clamp(1rem, 4vw, 2.5rem); }
        nav.tabs a { padding: .7rem 1.2rem .8rem; color: #cbbd9f; text-decoration: none; font-weight: 600; font-size: .92rem; border-bottom: 3px solid transparent; }
        nav.tabs a[aria-current="page"] { color: #fff; border-bottom-color: var(--gold); }
        nav.tabs a:hover { color: #fff; }
        main { max-width: 1240px; margin: 0 auto; padding: 1.6rem clamp(1rem, 4vw, 2.5rem) 4rem; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.3rem 1.4rem 1.4rem; box-shadow: 0 10px 28px rgba(60,40,10,.07); }
        .card h2 { margin: 0 0 .2rem; font: italic 400 1.45rem/1.2 Georgia, serif; }
        .sub { font-size: .78rem; color: var(--muted); margin-bottom: 1rem; }
        .empty { padding: 1.2rem; text-align: center; color: var(--muted); font-style: italic; }
        .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: .5rem 1rem; border-radius: 22px; cursor: pointer; font-size: .86rem; }
        .btn:hover { border-color: var(--gold); }
        a.btn { display: inline-block; text-decoration: none; }
        .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
        .btn.primary:hover { background: #3a2f22; }
        .bar { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem; margin-bottom: 1.3rem; }
        .bar b { font-weight: 600; margin-right: .2rem; }
        .bar .sp { flex: 1; }
        .bar small { color: var(--muted); }
        .chip { display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--line); background: var(--card); padding: .3rem .8rem .3rem .35rem; border-radius: 22px; cursor: pointer; font-size: .85rem; }
        .chip img, .chip .dot { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 2px solid var(--c, var(--gold)); }
        .chip .dot { display: inline-block; background: var(--c, var(--gold)); }
        .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
        .state-f { padding: .3rem .85rem; }

        /* ---------- tareas ---------- */
        .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; margin-bottom: 1.3rem; }
        .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: .9rem 1rem; }
        .kpi b { display: block; font: 600 1.9rem/1.1 Georgia, serif; }
        .kpi span { font-size: .72rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
        .kpi.alert b { color: var(--wine); }
        .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1.1rem; align-items: start; }
        .col { background: color-mix(in srgb, var(--c) 6%, var(--card)); border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 10px; padding: 1rem; }
        .col-head { display: flex; align-items: center; gap: .7rem; margin-bottom: .9rem; }
        .col-head img, .col-head .dot { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 3px solid var(--c); background: #fff; }
        .col-head strong { display: block; font: italic 500 1.2rem/1.15 Georgia, serif; }
        .col-head span { font-size: .75rem; color: var(--muted); }
        .col-head .add { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--c); background: #fff; color: var(--c); font-size: 1.2rem; cursor: pointer; line-height: 1; }
        .col-head .add:hover { background: var(--c); color: #fff; }
        .task { position: relative; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: .75rem .8rem .7rem 2.6rem; margin-bottom: .6rem; box-shadow: 0 3px 10px rgba(60,40,10,.05); }
        .task.hecha { opacity: .6; }
        .task.hecha .t-title { text-decoration: line-through; }
        .task .state { position: absolute; left: .6rem; top: .7rem; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--c); background: #fff; cursor: pointer; display: grid; place-items: center; color: #fff; font-size: .8rem; padding: 0; }
        .task.en-curso .state { background: linear-gradient(90deg, var(--c) 50%, #fff 50%); }
        .task.hecha .state { background: var(--c); }
        .t-title { font-weight: 600; line-height: 1.35; padding-right: 3.4rem; }
        .t-meta { display: flex; flex-wrap: wrap; gap: .35rem .6rem; margin-top: .3rem; font-size: .75rem; color: var(--muted); align-items: center; }
        .t-badge { padding: .05rem .5rem; border-radius: 10px; font-weight: 600; font-size: .68rem; letter-spacing: .5px; text-transform: uppercase; }
        .t-badge.alta { background: #f8e3df; color: var(--wine); }
        .t-badge.en-curso { background: #fdf1d8; color: #8a5a00; }
        .t-badge.hecha { background: #e4f1e7; color: #2f6b45; }
        .t-date.late { color: var(--wine); font-weight: 600; }
        .t-notes { margin: .4rem 0 0; font-size: .82rem; color: #5b5244; white-space: pre-wrap; }
        .t-actions { position: absolute; right: .4rem; top: .45rem; display: flex; gap: .1rem; opacity: .35; }
        .task:hover .t-actions, .task:focus-within .t-actions { opacity: 1; }
        .t-actions button { border: 0; background: none; cursor: pointer; padding: .2rem .3rem; font-size: .9rem; border-radius: 6px; }
        .t-actions button:hover { background: #f1e9da; }
        .col .none { font-size: .82rem; color: var(--muted); font-style: italic; padding: .4rem .2rem; }
        .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; padding: .75rem 1.2rem; border-radius: 8px; background: #1f3b2c; color: #e9f5ec; font-size: .9rem; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
        .toast.err { background: #6d2525; }
        dialog { border: 0; border-radius: 12px; padding: 0; width: min(520px, calc(100vw - 2rem)); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
        dialog::backdrop { background: rgba(20,14,8,.55); }
        dialog form { padding: 1.4rem 1.5rem 1.3rem; }
        dialog h3 { margin: 0 0 1rem; font: italic 400 1.5rem/1.2 Georgia, serif; }
        dialog label { display: flex; flex-direction: column; gap: .3rem; margin-bottom: .85rem; font-size: .75rem; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--gold-d); }
        dialog input, dialog select, dialog textarea { padding: .6rem .7rem; border: 1px solid #dccfb5; border-radius: 6px; background: #fffdf9; font-size: .95rem; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink); }
        dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
        dialog .acts { display: flex; justify-content: flex-end; gap: .6rem; margin-top: .4rem; }
        .notice { margin-bottom: 1rem; padding: .8rem 1rem; border-radius: 8px; background: #fff8e1; border-left: 3px solid #e0a800; font-size: .88rem; color: #6b5400; }

        /* ---------- métricas ---------- */
        .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 1.25rem; }
        .mk { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; }
        .mk div { padding: .75rem .7rem; border-radius: 8px; background: #f7f1e5; text-align: center; }
        .mk b { display: block; font: 600 1.7rem/1.1 Georgia, serif; }
        .mk span { font-size: .7rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
        .mk .main { background: #1d1a16; } .mk .main b { color: #f0d79a; } .mk .main span { color: #cbbd9f; }
        .note { margin: .8rem 0 0; font-size: .8rem; color: var(--muted); } .note b { color: var(--wine); }
        .wide { margin-top: 1.25rem; }
        .chart { width: 100%; height: 260px; display: block; }
        .legend { display: flex; flex-wrap: wrap; gap: 1rem; font-size: .8rem; color: var(--muted); margin-top: .4rem; }
        .legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: .35rem; }
        .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 1.25rem; margin-top: 1.25rem; }
        .hbars { list-style: none; margin: .5rem 0 0; padding: 0; }
        .hbars li { display: grid; grid-template-columns: minmax(0, 11rem) 1fr 2.5rem; align-items: center; gap: .7rem; margin: .45rem 0; font-size: .88rem; }
        .hbars .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hbars .b { height: 12px; border-radius: 6px; background: #efe6d4; overflow: hidden; }
        .hbars .b i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold-d), var(--gold)); }
        .hbars .n { text-align: right; font-weight: 600; }
        .help { font-size: .82rem; color: var(--muted); line-height: 1.6; }
        .gate { max-width: 520px; margin: 4rem auto; text-align: center; }
        .gate a { color: var(--gold-d); font-weight: 600; }
        /* ---------- visitas ---------- */
        nav.tabs { overflow-x: auto; scrollbar-width: none; }
        nav.tabs a { white-space: nowrap; display: inline-flex; align-items: center; gap: .45rem; }
        html.embed header { display: none; }
        html.embed main { padding-top: 1.3rem; }
        .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #3fb36b; box-shadow: 0 0 0 0 rgba(63,179,107,.6); animation: livePulse 2s infinite; }
        @keyframes livePulse { 70% { box-shadow: 0 0 0 8px rgba(63,179,107,0); } 100% { box-shadow: 0 0 0 0 rgba(63,179,107,0); } }
        .vk { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .8rem; margin-bottom: 1.25rem; }
        .vk .kpi.now { background: #1d1a16; border-color: #1d1a16; } .vk .kpi.now b { color: #7be0a1; display: flex; align-items: center; gap: .5rem; } .vk .kpi.now span { color: #cbbd9f; }
        .vk .kpi small { display: block; margin-top: .2rem; font-size: .72rem; color: var(--muted); }
        .feed { list-style: none; margin: .4rem 0 0; padding: 0; max-height: 430px; overflow: auto; }
        .feed li { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: .6rem; padding: .55rem 0; border-bottom: 1px solid #f0e8d8; font-size: .87rem; }
        .feed li:last-child { border-bottom: 0; }
        .feed time { color: var(--muted); font-variant-numeric: tabular-nums; }
        .feed .pg { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .feed .meta { display: block; font-size: .76rem; color: var(--muted); }
        .feed li.fresh { animation: fresh 2.5s ease-out; }
        @keyframes fresh { from { background: #fff4dc; } to { background: transparent; } }
        .hours { display: grid; grid-template-columns: repeat(24, 1fr); align-items: end; gap: 3px; height: 150px; margin-top: .8rem; }
        .hours i { display: block; background: linear-gradient(180deg, var(--gold), var(--gold-d)); border-radius: 3px 3px 0 0; min-height: 2px; }
        .hours-x { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; font-size: .64rem; color: var(--muted); text-align: center; margin-top: .3rem; }

        /* ---------- exportar ---------- */
        .exp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.25rem; }
        .opt { display: flex; flex-wrap: wrap; gap: .5rem; margin: .4rem 0 1.2rem; }
        .opt-title { font-size: .72rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--gold-d); }
        .fmt { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; }
        .fmt button { display: grid; justify-items: center; gap: .35rem; padding: 1.2rem .6rem 1rem; border: 1px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
        .fmt button:hover { transform: translateY(-2px); border-color: var(--gold); box-shadow: 0 10px 24px rgba(60,40,10,.1); }
        .fmt button[disabled] { opacity: .5; cursor: wait; }
        .fmt .ic { width: 44px; height: 52px; border-radius: 6px; display: grid; place-items: center; color: #fff; font: 700 .78rem/1 system-ui; letter-spacing: .5px; }
        .fmt .pdf .ic { background: #b3392f; } .fmt .xls .ic { background: #1f7a46; } .fmt .csv .ic { background: #4c5d73; }
        .fmt b { font-size: .95rem; } .fmt small { font-size: .74rem; color: var(--muted); text-align: center; }
        .incl { margin: 0; padding-left: 1.1rem; font-size: .86rem; line-height: 1.7; color: #5b5244; }
        @media (max-width: 900px) { .vk { grid-template-columns: repeat(2, minmax(0, 1fr)); } .vk .kpi.now { grid-column: 1 / -1; } }
        @media (max-width: 640px) { .kpis, .mk { grid-template-columns: repeat(2, 1fr); } .top .me span, .top a.back { display: none; } dialog .row { grid-template-columns: 1fr; } .fmt { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <div class="top">
            <svg viewBox="0 0 26 34" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M13 1.5v31M4.5 10.5h17" stroke-width="2"/><circle cx="13" cy="10.5" r="3.4" stroke-width="1.3"/></svg>
            <div><small>Parroquia Santa Teresa de Jesús</small><h1>Dashboard del equipo</h1></div>
            <div class="me" id="me"></div>
            <a class="back" href="/admin/">← Panel de reflexiones</a>
        </div>
        <nav class="tabs">
            <a href="#tareas" data-tab="tareas">📋 Tareas</a>
            <a href="#visitas" data-tab="visitas"><span class="live-dot"></span>Visitas en directo</a>
            <a href="#metricas" data-tab="metricas">📊 Formularios</a>
            <a href="#exportar" data-tab="exportar">⬇ Exportar</a>
        </nav>
    </header>
    <main id="app"><p class="empty">Cargando…</p></main>

    <dialog id="taskDlg">
        <form method="dialog" id="taskForm">
            <h3 id="dlgTitle">Nueva tarea</h3>
            <label>Tarea *<input name="titulo" required maxlength="140" placeholder="Ej.: Preparar la reflexión del domingo"></label>
            <div class="row">
                <label>Persona *<select name="persona" required></select></label>
                <label>Prioridad<select name="prioridad"><option value="normal">Normal</option><option value="alta">Alta</option></select></label>
            </div>
            <div class="row">
                <label>Estado<select name="estado"><option value="pendiente">Pendiente</option><option value="en-curso">En curso</option><option value="hecha">Hecha</option></select></label>
                <label>Fecha límite<input type="date" name="fecha"></label>
            </div>
            <label>Notas<textarea name="notas" rows="3" maxlength="1000" placeholder="Detalles, enlaces, a quién preguntar…"></textarea></label>
            <div class="acts"><button type="button" class="btn" id="dlgCancel">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div>
        </form>
    </dialog>

<script>
(function () {
    var app = document.getElementById("app");
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function toast(msg, err) {
        var t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
        document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 7000 : 3200);
    }
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var TODAY = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");

    /* ---------- sesión del panel ---------- */
    var user = null;
    try { user = JSON.parse(localStorage.getItem("decap-cms-user") || "null"); } catch (e) { }
    if (!user) {
        app.innerHTML = '<div class="gate card"><h2>Entra primero en el panel</h2><p>El dashboard es solo para el equipo de la parroquia.</p><p><a href="/admin/">Ir al panel e iniciar sesión →</a></p></div>';
        return;
    }
    var PEOPLE = {}, ORDER = [], ME = null;
    function photo(p) { return p && p.foto ? (p.foto.charAt(0) === "/" ? p.foto : "/" + p.foto) : ""; }
    function sha256(s) {
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (b) {
            return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
        });
    }
    var ready = fetch("/contenido/autores.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
        (d.autores || []).forEach(function (a) { PEOPLE[a.id] = a; ORDER.push(a.id); });
        var email = String(user.email || user.login || (user.user_metadata && user.user_metadata.email) || "").trim().toLowerCase();
        return email && window.crypto && crypto.subtle ? sha256(email).then(function (h) {
            ORDER.forEach(function (id) { if ((PEOPLE[id].acceso || []).indexOf(h) > -1) ME = PEOPLE[id]; });
        }) : null;
    }).then(function () {
        var me = document.getElementById("me");
        var name = ME ? ME.nombre : (user.user_metadata && user.user_metadata.full_name) || user.email || "";
        me.innerHTML = (ME && photo(ME) ? '<img src="' + esc(photo(ME)) + '" alt="">' : "") + "<span>" + esc(name) + "</span>";
    });

    /* ---------- tareas: se leen y se guardan en contenido/tareas.json a través de DecapBridge ---------- */
    var GW = null, REPO = null, BRANCH = "main", FILE = "contenido/tareas.json";
    var cfgReady = fetch("/admin/config.yml", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (y) {
        var g = /gateway_url:\s*(\S+)/.exec(y), rp = /\brepo:\s*(\S+)/.exec(y), br = /\bbranch:\s*(\S+)/.exec(y);
        GW = g ? g[1].replace(/\/+$/, "") + "/github" : null; REPO = rp && rp[1]; if (br) BRANCH = br[1];
    });
    var tasks = [], sha = null, filterP = "", filterS = "abiertas";
    /* llave de acceso: la que acaba de usar el propio panel con DecapBridge; si no, la guardada al iniciar sesión */
    function gwToken() {
        try { var k = JSON.parse(localStorage.getItem("pst-gw-token") || "null"); if (k && k.t) return k.t; } catch (e) { }
        var t = user.token;
        return typeof t === "string" ? t : (t && (t.access_token || t.token)) || "";
    }
    function b64enc(s) { return btoa(unescape(encodeURIComponent(s))); }
    function b64dec(s) { return decodeURIComponent(escape(atob(s.replace(/\s/g, "")))); }
    function api(path, opts) {
        opts = opts || {};
        opts.headers = Object.assign({ "Authorization": "Bearer " + gwToken(), "Content-Type": "application/json" }, opts.headers || {});
        return fetch(GW + "/repos/" + REPO + path, opts).then(function (r) {
            if (r.status === 401 || r.status === 403) throw new Error("sesion");
            return r;
        });
    }
    function loadTasks() {
        return api("/contents/" + FILE + "?ref=" + BRANCH + "&t=" + Date.now()).then(function (r) {
            if (r.status === 404) { tasks = []; sha = null; return; }
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json().then(function (j) { sha = j.sha; tasks = (JSON.parse(b64dec(j.content)).tareas || []); });
        });
    }
    function saveTasks(msg, retried) {
        var body = { message: msg, branch: BRANCH, content: b64enc(JSON.stringify({ tareas: tasks }, null, 2) + "\n") };
        if (sha) body.sha = sha;
        return api("/contents/" + FILE, { method: "PUT", body: JSON.stringify(body) }).then(function (r) {
            if ((r.status === 409 || r.status === 422) && !retried) throw new Error("conflicto");
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json().then(function (j) { sha = j.content && j.content.sha; });
        });
    }
    function who() { return ME ? ME.nombre : (user.email || "el equipo"); }
    /* cambio = función que modifica la lista; si alguien guardó a la vez, se recarga y se repite */
    function change(mutate, msg) {
        mutate();
        renderTasks();
        return saveTasks(msg + " — por " + who()).then(function () { toast("✓ Guardado"); })
            .catch(function (e) {
                if (e.message === "conflicto") {

        var x = function (i) { return L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)); }, y = function (v) { return T + (H - T - B) * (1 - v / max); };
        var g = "";
        for (var i = 0; i <= 4; i++) { var v = Math.round(max * i / 4), yy = y(v); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="#ece3d1"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="#9a8e78">' + v + "</text>"; }
        var step = Math.max(1, Math.ceil(n / 8));
        series.forEach(function (s, i) { if (i % step === 0 || i === n - 1) g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="#9a8e78">' + s.day.slice(8, 10) + "/" + s.day.slice(5, 7) + "</text>"; });
        var pts = function (k) { return series.map(function (s, i) { return x(i).toFixed(1) + "," + y(s[k]).toFixed(1); }).join(" "); };
        g += '<polygon points="' + L + "," + y(0) + " " + pts("views") + " " + x(n - 1) + "," + y(0) + '" fill="rgba(191,160,101,.16)"/>';
        g += '<polyline points="' + pts("views") + '" fill="none" stroke="#8f7340" stroke-width="2.6" stroke-linejoin="round"/>';
        g += '<polyline points="' + pts("entries") + '" fill="none" stroke="#3b6a8f" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>';
        return '<svg class="chart" style="height:240px" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">' + g + '</svg><div class="legend"><span><i style="background:#8f7340"></i>Páginas vistas</span><span><i style="background:repeating-linear-gradient(90deg,#3b6a8f 0 5px,transparent 5px 9px)"></i>Visitas (personas que entran en la web)</span></div>';
    }
    function renderVisits(isLive) {
        var v = vData, t = v.total, nDays = v.series.length;
        var pages = {}; Object.keys(t.pages).forEach(function (p) { var k = pageName(p); pages[k] = (pages[k] || 0) + t.pages[p]; });
        var refs = {}; Object.keys(t.refs).forEach(function (r) { refs[refName(r)] = t.refs[r]; });
        var hrs = []; for (var h = 0; h < 24; h++) hrs.push(t.hours[String(h).padStart(2, "0")] || 0);
        var hmax = Math.max.apply(null, hrs.concat(1));
        var feed = (v.now.recent || []).map(function (r) {
            var id = r.ts + r.path, fresh = isLive && !seen[id]; seen[id] = 1;
            return '<li' + (fresh ? ' class="fresh"' : "") + '><time>' + hm(r.ts) + '</time><div><span class="pg">' + esc(pageName(r.path)) + '</span><span class="meta">' + esc((DEVS[r.dev] || r.dev) + " · " + (LANGS[r.lang] || r.lang) + (r.entry ? " · llega desde " + refName(r.ref) : " · navegando por la web")) + "</span></div></li>";
        }).join("");
        var html = '<div class="bar"><b>Periodo:</b>' + [7, 30, 90, 365].map(function (d) {
            return '<button class="chip state-f" data-vdays="' + d + '" aria-pressed="' + (d === vDays) + '">' + (d === 365 ? "1 año" : "Últimos " + d + " días") + "</button>";
        }).join("") + '<span class="sp"></span><small>En directo · se actualiza cada 15 s · ' + new Date(v.generated).toLocaleTimeString("es-ES") + '</small><a class="btn" href="#exportar">⬇ Exportar</a></div>';
        html += '<div class="vk"><div class="kpi now"><b><span class="live-dot"></span>' + v.now.active + "</b><span>Personas ahora mismo</span></div>" +
            '<div class="kpi"><b>' + v.now.last30 + "</b><span>Páginas vistas · últimos 30 min</span></div>" +
            '<div class="kpi"><b>' + v.today.entries + "</b><span>Visitas hoy</span><small>" + v.today.views + " páginas vistas</small></div>" +
            '<div class="kpi"><b>' + t.entries + "</b><span>Visitas en el periodo</span><small>media " + Math.round(t.entries / nDays * 10) / 10 + " al día</small></div>" +
            '<div class="kpi"><b>' + t.views + "</b><span>Páginas vistas en el periodo</span><small>" + (t.entries ? Math.round(t.views / t.entries * 10) / 10 : 0) + " por visita</small></div></div>";
        html += '<div class="two" style="margin-top:0"><section class="card"><h2>Evolución diaria</h2><div class="sub">' + dmy(v.since) + " – " + dmy(v.day) + "</div>" + vChart(v.series) + "</section>" +
            '<section class="card"><h2>Ahora mismo</h2><div class="sub">Últimas páginas abiertas hoy (hora de Barcelona)</div>' + (feed ? '<ul class="feed">' + feed + "</ul>" : '<p class="empty">Todavía no hay visitas hoy.</p>') + "</section></div>";
        html += '<div class="two"><section class="card"><h2>Páginas más vistas</h2>' + hbars(pages, {}) + "</section>" +
            '<section class="card"><h2>¿Desde dónde llegan?</h2><div class="sub">Web o aplicación desde la que se entra</div>' + hbars(refs, {}) + "</section></div>";
        html += '<div class="two"><section class="card"><h2>Dispositivos</h2>' + hbars(t.devs, DEVS) + '</section><section class="card"><h2>Idioma de la web</h2>' + hbars(t.langs, LANGS) + "</section></div>";
        html += '<section class="card wide"><h2>¿A qué hora se visita más?</h2><div class="sub">Páginas vistas por hora del día en el periodo</div><div class="hours">' +
            hrs.map(function (n, i) { return '<i style="height:' + Math.max(1.5, n / hmax * 100) + '%" title="' + i + ":00 · " + n + '"></i>'; }).join("") + '</div><div class="hours-x">' +
            hrs.map(function (n, i) { return "<span>" + (i % 3 === 0 ? i + "h" : "") + "</span>"; }).join("") + "</div></section>";
        html += '<p class="help" style="margin-top:1.2rem"><b>Visita:</b> alguien entra en la web desde fuera (Google, Instagram, un enlace…). <b>Página vista:</b> cada página que se abre. ' +
            "<b>Ahora mismo:</b> pestañas con la web abierta y a la vista en el último minuto. Las cifras son anónimas: sin cookies, sin IP y sin guardar nada en el navegador de quien visita. No se cuentan el panel ni los robots de los buscadores.</p>";
        var y = window.scrollY;
        app.innerHTML = html;
        if (isLive) window.scrollTo(0, y);
        app.querySelectorAll("[data-vdays]").forEach(function (b) { b.onclick = function () { vDays = +b.getAttribute("data-vdays"); showVisits(); }; });
    }

    /* ---------- exportar: PDF, Excel y CSV ---------- */
    var LIBS = {
        xlsx: ["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js", "sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw"],
        pdf: ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk"],
        table: ["https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js", "sha384-fCAW/rDWORTbQXSiB7mOg0QtQ5c+r0f544y6XoKjuVva0nMBlCpNUjiFeG5iMdS3"]
    };
    var loaded = {};
    function lib(name) {
        if (!loaded[name]) loaded[name] = new Promise(function (ok, ko) {
            var s = document.createElement("script"); s.src = LIBS[name][0]; s.integrity = LIBS[name][1]; s.crossOrigin = "anonymous";
            s.onload = ok; s.onerror = function () { delete loaded[name]; ko(new Error("no se pudo cargar la librería")); };
            document.head.appendChild(s);
        });
        return loaded[name];
    }
    var xWhat = "todo", xDays = 30;
    function sorted(obj, names) {
        return Object.keys(obj).sort(function (a, b) { return obj[b] - obj[a]; }).map(function (k) { return [names ? (names[k] || k) : k, obj[k]]; });
    }
    function visitTables(v) {
        var t = v.total, pages = {};
        Object.keys(t.pages).forEach(function (p) { var k = pageName(p) + (pageName(p) !== p ? " (" + p + ")" : ""); pages[k] = (pages[k] || 0) + t.pages[p]; });
        var top = sorted(pages)[0];
        var hrs = []; for (var h = 0; h < 24; h++) hrs.push([String(h).padStart(2, "0") + ":00", t.hours[String(h).padStart(2, "0")] || 0]);
        return [
            { name: "Resumen de visitas", cols: ["Dato", "Valor"], rows: [["Periodo", dmy(v.since) + " - " + dmy(v.day)], ["Visitas (personas que entran en la web)", t.entries],
                ["Páginas vistas", t.views], ["Media de visitas al día", Math.round(t.entries / v.series.length * 10) / 10], ["Páginas por visita", t.entries ? Math.round(t.views / t.entries * 10) / 10 : 0],
                ["Página más vista", top ? top[0] + " (" + top[1] + ")" : "-"]] },
            { name: "Visitas por día", cols: ["Fecha", "Visitas", "Páginas vistas"], rows: v.series.map(function (s) { return [dmy(s.day), s.entries, s.views]; }) },
            { name: "Páginas más vistas", cols: ["Página", "Vistas"], rows: sorted(pages) },
            { name: "Procedencia", cols: ["Desde", "Visitas"], rows: sorted(t.refs).map(function (r) { return [refName(r[0]), r[1]]; }) },
            { name: "Dispositivos", cols: ["Dispositivo", "Páginas vistas"], rows: sorted(t.devs, { movil: "Móvil", tablet: "Tableta", ordenador: "Ordenador" }) },
            { name: "Idiomas", cols: ["Idioma", "Páginas vistas"], rows: sorted(t.langs, LANGS) },
            { name: "Visitas por hora", cols: ["Hora", "Páginas vistas"], rows: hrs }
        ];
    }
    function formTables(m) {
        var r = tally(m), daily = [], purp = [];
        r.days.forEach(function (d) { Object.keys(FORMS).forEach(function (f) { var x = r.t[f].daily[d]; if (x.view || x.submit) daily.push([dmy(d), FORMS[f], x.view, x.submit]); }); });
        Object.keys(FORMS).forEach(function (f) { sorted(r.t[f].purpose).forEach(function (p) { purp.push([FORMS[f], nice(p[0]), p[1]]); }); });
        return [
            { name: "Resumen de formularios", cols: ["Formulario", "Vistos", "Empezados", "Enviados", "Errores", "Conversión %"], rows: Object.keys(FORMS).map(function (f) {
                var s = r.t[f]; return [FORMS[f], s.view, s.start, s.submit, s.error, s.view ? Math.round(s.submit / s.view * 1000) / 10 : 0]; }) },
            { name: "Formularios por día", cols: ["Fecha", "Formulario", "Vistos", "Enviados"], rows: daily },
            { name: "Envíos por motivo", cols: ["Formulario", "Motivo o curso", "Envíos"], rows: purp }
        ];
    }
    function collect() {
        var jobs = [];
        if (xWhat !== "formularios") jobs.push(getVisits(xDays).then(visitTables));
        if (xWhat !== "visitas") jobs.push(fetch("/api/form-stats?days=" + xDays + "&t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(formTables));
        return Promise.all(jobs).then(function (parts) { return [].concat.apply([], parts); });
    }
    function fileName(ext) { return "metricas-parroquia-" + xWhat + "-" + xDays + "dias-" + TODAY + "." + ext; }
    function download(blob, name) { var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); }
    var EXPORTERS = {
        csv: function (tables) {
            var cell = function (c) { c = String(c == null ? "" : c); return /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; };
            var out = [];
            tables.forEach(function (tb) { out.push(cell(tb.name)); out.push(tb.cols.map(cell).join(";")); tb.rows.forEach(function (r) { out.push(r.map(cell).join(";")); }); out.push(""); });
            download(new Blob(["﻿" + out.join("\r\n")], { type: "text/csv;charset=utf-8" }), fileName("csv"));
            return Promise.resolve();
        },
        xlsx: function (tables) {
            return lib("xlsx").then(function () {
                var wb = XLSX.utils.book_new(), used = {};
                tables.forEach(function (tb) {
                    var ws = XLSX.utils.aoa_to_sheet([tb.cols].concat(tb.rows));
                    ws["!cols"] = tb.cols.map(function (c, i) { return { wch: Math.min(60, Math.max(String(c).length, ...tb.rows.map(function (r) { return String(r[i]).length; })) + 2) }; });
                    var n = tb.name.slice(0, 31); while (used[n]) n = n.slice(0, 29) + "_" + (used[n]++); used[n] = 1;
                    XLSX.utils.book_append_sheet(wb, ws, n);
                });
                XLSX.writeFile(wb, fileName("xlsx"));
            });
        },
        pdf: function (tables) {
            return lib("pdf").then(function () { return lib("table"); }).then(function () {
                var doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" }), W = doc.internal.pageSize.getWidth();
                doc.setFillColor(29, 26, 22); doc.rect(0, 0, W, 78, "F");
                doc.setTextColor(240, 215, 154); doc.setFontSize(9); doc.text("PARROQUIA SANTA TERESA DE JESÚS · BARCELONA", 40, 30);
                doc.setTextColor(255, 255, 255); doc.setFont("times", "italic"); doc.setFontSize(21);
                doc.text({ todo: "Informe de visitas y formularios", visitas: "Informe de visitas de la web", formularios: "Informe de formularios" }[xWhat], 40, 57);
                doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(120, 110, 95);
                doc.text("Últimos " + xDays + " días · generado el " + new Date().toLocaleString("es-ES") + " · datos anónimos", 40, 98);
                var y = 120;
                tables.forEach(function (tb) {
                    if (y > doc.internal.pageSize.getHeight() - 110) { doc.addPage(); y = 50; }
                    doc.setFont("times", "italic"); doc.setFontSize(14); doc.setTextColor(29, 26, 22); doc.text(tb.name, 40, y);
                    doc.autoTable({ startY: y + 8, head: [tb.cols], body: tb.rows.length ? tb.rows : [[ "Sin datos en este periodo" ].concat(tb.cols.slice(1).map(function () { return ""; }))],
                        theme: "grid", margin: { left: 40, right: 40 }, styles: { font: "helvetica", fontSize: 8.5, cellPadding: 4, lineColor: [230, 218, 194], textColor: [40, 35, 30] },
                        headStyles: { fillColor: [143, 115, 64], textColor: 255, fontStyle: "bold" }, alternateRowStyles: { fillColor: [250, 246, 238] } });
                    y = doc.lastAutoTable.finalY + 30;
                });
                var pages = doc.internal.getNumberOfPages();
                for (var i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(150, 140, 120); doc.text("Página " + i + " de " + pages, W - 40, doc.internal.pageSize.getHeight() - 20, { align: "right" }); }
                doc.save(fileName("pdf"));
            });
        }
    };
    function showExport() {
        var opt = function (attr, val, cur, txt) { return '<button class="chip state-f" ' + attr + '="' + val + '" aria-pressed="' + (val === cur) + '">' + txt + "</button>"; };
        var incl = { visitas: ["Resumen de visitas", "Visitas y páginas vistas por día", "Páginas más vistas", "Procedencia, dispositivos e idiomas", "Visitas por hora"],
            formularios: ["Resumen de cada formulario (vistos, empezados, enviados, conversión)", "Evolución por día", "Envíos por motivo o curso escolar"] };
        var list = (xWhat === "todo" ? incl.visitas.concat(incl.formularios) : incl[xWhat]);
        app.innerHTML = '<div class="exp-grid"><section class="card"><h2>¿Qué quieres exportar?</h2><div class="sub">Elige los datos y el periodo; después, el formato.</div>' +
            '<div class="opt-title">Datos</div><div class="opt">' + opt("data-xw", "todo", xWhat, "Todo") + opt("data-xw", "visitas", xWhat, "Visitas de la web") + opt("data-xw", "formularios", xWhat, "Formularios") + "</div>" +
            '<div class="opt-title">Periodo</div><div class="opt">' + [7, 30, 90, 365].map(function (d) { return opt("data-xd", String(d), String(xDays), d === 365 ? "1 año" : "Últimos " + d + " días"); }).join("") + "</div>" +
            '<div class="opt-title">Incluye</div><ul class="incl">' + list.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></section>" +
            '<section class="card"><h2>Formato</h2><div class="sub">El archivo se descarga en este ordenador.</div><div class="fmt">' +
            '<button class="pdf" data-fmt="pdf"><span class="ic">PDF</span><b>PDF</b><small>Informe listo para imprimir o enviar</small></button>' +
            '<button class="xls" data-fmt="xlsx"><span class="ic">XLS</span><b>Excel</b><small>Una hoja por tabla, para hacer cálculos</small></button>' +
            '<button class="csv" data-fmt="csv"><span class="ic">CSV</span><b>CSV</b><small>Texto separado por «;», para cualquier programa</small></button></div>' +
            '<p class="note" id="xstatus"></p></section></div>';
        app.querySelectorAll("[data-xw]").forEach(function (b) { b.onclick = function () { xWhat = b.getAttribute("data-xw"); showExport(); }; });
        app.querySelectorAll("[data-xd]").forEach(function (b) { b.onclick = function () { xDays = +b.getAttribute("data-xd"); showExport(); }; });
        app.querySelectorAll("[data-fmt]").forEach(function (b) {
            b.onclick = function () {
                var st = document.getElementById("xstatus"), all = app.querySelectorAll("[data-fmt]");
                all.forEach(function (x) { x.disabled = true; }); st.textContent = "Preparando el archivo…";
                collect().then(function (tables) { return EXPORTERS[b.getAttribute("data-fmt")](tables); })
                    .then(function () { st.textContent = "✓ Descargado."; toast("✓ Archivo descargado"); })
                    .catch(function (e) { st.textContent = ""; toast("No se pudo exportar: " + e.message, true); })
                    .then(function () { all.forEach(function (x) { x.disabled = false; }); });
            };
        });
    }

    /* ---------- pestañas ---------- */
    var TABS = { tareas: ["Tareas", showTasks], visitas: ["Visitas", showVisits], metricas: ["Formularios", showMetrics], exportar: ["Exportar", showExport] };
    function route() {
        var tab = location.hash.slice(1);
        if (!TABS[tab]) tab = "tareas";
        stopLive();
        document.querySelectorAll("nav.tabs a").forEach(function (a) { a.setAttribute("aria-current", a.getAttribute("data-tab") === tab ? "page" : "false"); });
        try { if (window.parent !== window && parent.pstMarkTab) parent.pstMarkTab(tab); } catch (e) { }
        document.title = TABS[tab][0] + " · Dashboard · Parroquia Santa Teresa de Jesús";
        TABS[tab][1]();
    }
    window.addEventListener("hashchange", route);
    route();
})();
</script>
</body>
</html>
