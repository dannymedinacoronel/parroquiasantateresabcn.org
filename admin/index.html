<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel de homilías · Parroquia Santa Teresa de Jesús</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
    <style>
        /* Pantalla de carga con los colores de la parroquia */
        body { margin: 0; background: #f6eedf; }
        #pst-loading {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
            font-family: Georgia, "Times New Roman", serif; color: #1a1a1a; background: #f6eedf; z-index: 0;
        }
        #pst-loading svg { width: 34px; height: 44px; color: #bfa065; animation: pst-pulse 1.6s ease-in-out infinite; }
        #pst-loading strong { font-size: 1.6rem; font-style: italic; font-weight: 400; }
        #pst-loading span { font-family: system-ui, sans-serif; font-size: .8rem; letter-spacing: 3px; text-transform: uppercase; color: #8f7340; }
        @keyframes pst-pulse { 50% { opacity: .4; } }

        /* Tarjeta «Evangelio de hoy» con el botón para preparar la reflexión del día */
        #pst-hoy {
            position: fixed; right: 22px; bottom: 22px; z-index: 300; width: 300px; display: none;
            padding: 1.1rem 1.2rem 1.15rem; background: #fffaf0; border: 1px solid #e2d1ad; border-top: 4px solid #7a2e2e;
            border-radius: 6px; box-shadow: 0 18px 40px rgba(40,25,5,.22); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #3a3226;
        }
        #pst-hoy.on { display: block; animation: pst-in .35s ease-out; }
        #pst-hoy.min > :not(.pst-hoy-top) { display: none; }
        @keyframes pst-in { from { opacity: 0; transform: translateY(12px); } }
        .pst-hoy-top { display: flex; justify-content: space-between; align-items: center; font-size: .68rem; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: #7a2e2e; }
        .pst-hoy-top button { border: 0; background: none; cursor: pointer; font-size: 1rem; color: #8f7340; padding: 0 .2rem; }
        #pst-hoy strong { display: block; margin: .45rem 0 .2rem; font-family: Georgia, "Times New Roman", serif; font-size: 1.2rem; font-style: italic; font-weight: 400; line-height: 1.25; color: #1a1a1a; }
        #pst-hoy small { display: block; font-size: .78rem; color: #8a7e6c; }
        #pst-hoy .pst-go { display: block; width: 100%; margin: .9rem 0 .55rem; padding: .75rem; border: 0; border-radius: 4px; cursor: pointer;
            background: #bfa065; color: #fff; font-size: .74rem; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; }
        #pst-hoy .pst-go:hover { background: #8f7340; }
        #pst-hoy a { font-size: .78rem; color: #8f7340; font-weight: 600; }
        #pst-hoy p { margin: .6rem 0 0; font-size: .75rem; line-height: 1.45; color: #8a7e6c; }
        #pst-hoy .pst-see { display: block; width: 100%; padding: .6rem; margin-bottom: .55rem; border: 1px solid #bfa065; border-radius: 4px; cursor: pointer;
            background: #fff; color: #8f7340; font-size: .72rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
        #pst-hoy .pst-see:hover { background: #f6eedf; }

        /* Ventana flotante con el Evangelio del día: se mueve arrastrando la barra y se agranda desde la esquina */
        #pst-ev {
            position: fixed; right: 22px; top: 90px; z-index: 400; width: 400px; height: 560px; min-width: 260px; min-height: 160px;
            max-width: calc(100vw - 20px); max-height: calc(100vh - 20px);
            display: none; flex-direction: column; overflow: hidden; resize: both;
            background: #fffaf0; border: 1px solid #e2d1ad; border-radius: 8px; box-shadow: 0 22px 50px rgba(40,25,5,.3);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        #pst-ev.on { display: flex; }
        #pst-ev.min { height: auto !important; min-height: 0; resize: none; }
        #pst-ev.min .pst-ev-body { display: none; }
        .pst-ev-bar { display: flex; align-items: center; gap: .4rem; padding: .5rem .55rem .5rem .8rem; background: #2a1d17; color: #f0d79a; cursor: move; user-select: none; touch-action: none; }
        .pst-ev-bar b { flex: 1; font-size: .68rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pst-ev-bar button { border: 0; background: rgba(255,255,255,.08); color: #f0d79a; border-radius: 4px; min-width: 26px; height: 26px; cursor: pointer; font-size: .78rem; font-weight: 700; }
        .pst-ev-bar button:hover { background: rgba(255,255,255,.2); }
        .pst-ev-bar button[aria-pressed="true"] { background: #bfa065; color: #2a1d17; }
        .pst-ev-body { position: relative; flex: 1; min-height: 0; }
        .pst-ev-body iframe { position: absolute; top: 0; left: 0; border: 0; background: #fff; transform-origin: 0 0; }
        #pst-ev.drag iframe { pointer-events: none; }
        #pst-ev-tab { position: fixed; left: 22px; bottom: 22px; z-index: 399; display: none; padding: .65rem 1rem; border: 0; border-radius: 30px; cursor: pointer;
            background: #2a1d17; color: #f0d79a; font: 700 .72rem system-ui, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; box-shadow: 0 10px 25px rgba(40,25,5,.3); }
        #pst-ev-tab.on { display: block; }
    </style>
</head>
<body>
    <div id="pst-loading">
        <svg viewBox="0 0 26 34" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M13 1.5v31M4.5 10.5h17" stroke-width="2"/><circle cx="13" cy="10.5" r="3.4" stroke-width="1.3"/></svg>
        <strong>Parroquia Santa Teresa de Jesús</strong>
        <span>Panel de homilías</span>
    </div>

    <aside id="pst-hoy" aria-label="Evangelio de hoy">
        <div class="pst-hoy-top"><span>✝ Evangelio de hoy</span><button type="button" id="pst-hoy-min" title="Plegar / desplegar">–</button></div>
        <strong id="pst-hoy-dia"></strong>
        <small id="pst-hoy-fecha"></small>
        <button type="button" class="pst-go" id="pst-hoy-go">✚ Preparar la reflexión de hoy</button>
        <button type="button" class="pst-see" id="pst-hoy-see">📖 Ver el Evangelio aquí</button>
        <a href="https://evangeli.net/evangelio" target="_blank" rel="noopener">Abrir en otra pestaña ↗</a>
        <p>Se abre ya firmada por la parroquia, con la fecha y el día litúrgico. El Evangelio queda en una ventanita al lado para ir siguiéndolo mientras escribes.</p>
    </aside>

    <!-- Ventanita con el Evangelio del día (evangeli.net), visible también mientras se escribe -->
    <section id="pst-ev" aria-label="Evangelio de hoy">
        <div class="pst-ev-bar" id="pst-ev-bar">
            <b>📖 Evangelio de hoy</b>
            <button type="button" data-lang="es" aria-pressed="true" title="Castellano">ES</button>
            <button type="button" data-lang="ca" aria-pressed="false" title="Català">CA</button>
            <button type="button" data-lang="en" aria-pressed="false" title="English">EN</button>
            <button type="button" id="pst-ev-small" title="Letra más pequeña">A−</button>
            <button type="button" id="pst-ev-big" title="Letra más grande">A+</button>
            <button type="button" id="pst-ev-min" title="Plegar / desplegar">–</button>
            <button type="button" id="pst-ev-close" title="Cerrar">✕</button>
        </div>
        <div class="pst-ev-body"><iframe id="pst-ev-frame" title="Evangelio de hoy" loading="lazy"></iframe></div>
    </section>
    <button type="button" id="pst-ev-tab">📖 Evangelio de hoy</button>

    <!-- Calendario litúrgico (el mismo que usa la web) -->
    <script src="/js/liturgia.js"></script>
    <!-- Panel de edición (Decap CMS). La configuración está en /admin/config.yml -->
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
    <script>
    (function () {
        /* Quita la pantalla de carga en cuanto el panel aparece */
        var loading = document.getElementById("pst-loading");
        new MutationObserver(function (m, obs) {
            if (document.getElementById("nc-root")) { loading.remove(); obs.disconnect(); }
        }).observe(document.body, { childList: true });

        /* ------------------------------------------------------------------
           «Preparar la reflexión de hoy»: abre una reflexión nueva ya rellena
           (firma de la parroquia, fecha, día litúrgico y plantilla del texto).
           Decap admite valores iniciales en la dirección: #/collections/x/new?campo=valor
           (sin comillas ni < > porque el panel los escapa).
           ------------------------------------------------------------------ */
        var hoyCard = document.getElementById("pst-hoy");
        var hoy = new Date();
        var hoyISO = hoy.getFullYear() + "-" + String(hoy.getMonth() + 1).padStart(2, "0") + "-" + String(hoy.getDate()).padStart(2, "0");
        var diaLit = window.PSTLiturgia ? window.PSTLiturgia.dia(hoy, "es") : "";
        document.getElementById("pst-hoy-dia").textContent = diaLit || "Evangelio del día";
        document.getElementById("pst-hoy-fecha").textContent = hoy.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        document.getElementById("pst-hoy-go").addEventListener("click", function () {
            var q = new URLSearchParams({
                titulo: "El Evangelio de hoy",
                autor: "parroquia",
                fecha: hoyISO,
                tiempo: diaLit + " · " + hoy.getFullYear(),
                saludo: "Queridos hermanos y hermanas:",
                texto: "### [Cita del Evangelio de hoy, por ejemplo: Lc 12, 35-38]\n\n" +
                    "[Escribe aquí la reflexión sobre el Evangelio de hoy. Separa los párrafos con una línea en blanco. " +
                    "Para destacar una frase en grande, selecciónala y pulsa «Cita».]\n\n" +
                    "Que el Señor nos acompañe en este día. Unidos en la oración.",
                publicado: "true"
            });
            location.hash = "#/collections/homilias/new?" + q.toString();
            evOpen(true);
        });

        /* ------------------------------------------------------------------
           Ventanita del Evangelio: se arrastra por la barra, se agranda desde
           la esquina, tiene idioma y tamaño de letra, y recuerda su sitio.
           ------------------------------------------------------------------ */
        var ev = document.getElementById("pst-ev"), evFrame = document.getElementById("pst-ev-frame"),
            evTab = document.getElementById("pst-ev-tab"), evBar = document.getElementById("pst-ev-bar");
        var EV_URL = { es: "https://evangeli.net/evangelio/widget/web", ca: "https://evangeli.net/evangeli/widget/web", en: "https://evangeli.net/gospel/widget/web" };
        var evState = { lang: "es", zoom: 1, open: false };
        try { var saved = JSON.parse(localStorage.getItem("pst-ev") || "null"); if (saved) evState = Object.assign(evState, saved); } catch (e) { }
        function evSave() {
            try {
                evState.box = { left: ev.style.left, top: ev.style.top, width: ev.style.width, height: ev.style.height };
                localStorage.setItem("pst-ev", JSON.stringify(evState));
            } catch (e) { }
        }
        function evZoom() {
            // Se escala el visor entero (la página de evangeli.net no deja cambiar su letra desde fuera)
            var z = evState.zoom;
            evFrame.style.transform = "scale(" + z + ")";
            evFrame.style.width = (100 / z) + "%";
            evFrame.style.height = (100 / z) + "%";
        }
        function evLang(l) {
            evState.lang = EV_URL[l] ? l : "es";
            if (evFrame.getAttribute("src") !== EV_URL[evState.lang]) evFrame.src = EV_URL[evState.lang];
            ev.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === evState.lang)); });
        }
        function evOpen(show) {
            evState.open = show;
            if (show) { evLang(evState.lang); ev.classList.remove("min"); document.getElementById("pst-ev-min").textContent = "–"; }
            ev.classList.toggle("on", show);
            evTabVisible();
            evSave();
        }
        function evTabVisible() {
            // La pestañita aparece cuando la ventana está cerrada y se está escribiendo una reflexión
            var editing = /^#\/collections\/homilias\/(new|entries)/.test(location.hash);
            evTab.classList.toggle("on", editing && !evState.open);
        }
        if (evState.box && evState.box.width) {
            ["left", "top", "width", "height"].forEach(function (k) { if (evState.box[k]) ev.style[k] = evState.box[k]; });
            if (evState.box.left) ev.style.right = "auto";
        }
        evZoom();
        ev.querySelectorAll("[data-lang]").forEach(function (b) {
            b.addEventListener("click", function () { evLang(b.getAttribute("data-lang")); evSave(); });
        });
        document.getElementById("pst-ev-big").addEventListener("click", function () { evState.zoom = Math.min(1.6, +(evState.zoom + .1).toFixed(2)); evZoom(); evSave(); });
        document.getElementById("pst-ev-small").addEventListener("click", function () { evState.zoom = Math.max(.6, +(evState.zoom - .1).toFixed(2)); evZoom(); evSave(); });
        document.getElementById("pst-ev-close").addEventListener("click", function () { evOpen(false); });
        document.getElementById("pst-ev-min").addEventListener("click", function () {
            ev.classList.toggle("min");
            this.textContent = ev.classList.contains("min") ? "+" : "–";
        });
        document.getElementById("pst-hoy-see").addEventListener("click", function () { evOpen(true); });
        evTab.addEventListener("click", function () { evOpen(true); });
        // Arrastrar por la barra (ratón, táctil o lápiz)
        evBar.addEventListener("pointerdown", function (e) {
            if (e.target.closest("button")) return;
            var r = ev.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
            ev.classList.add("drag");
            evBar.setPointerCapture(e.pointerId);
            function move(m) {
                var x = Math.max(0, Math.min(window.innerWidth - 80, m.clientX - dx));
                var y = Math.max(0, Math.min(window.innerHeight - 40, m.clientY - dy));
                ev.style.left = x + "px"; ev.style.top = y + "px"; ev.style.right = "auto";
            }
            function up() {
                ev.classList.remove("drag");
                evBar.removeEventListener("pointermove", move);
                evBar.removeEventListener("pointerup", up);
                evSave();
            }
            evBar.addEventListener("pointermove", move);
            evBar.addEventListener("pointerup", up);
        });
        // Guardar el tamaño al agrandar desde la esquina
        if (window.ResizeObserver) {
            var evT;
            new ResizeObserver(function () {
                if (!ev.classList.contains("on") || ev.classList.contains("min")) return;
                clearTimeout(evT);
                evT = setTimeout(function () { ev.style.width = ev.offsetWidth + "px"; ev.style.height = ev.offsetHeight + "px"; evSave(); }, 300);
            }).observe(ev);
        }
        window.addEventListener("hashchange", evTabVisible);
        if (evState.open) evOpen(true); else evTabVisible();
        document.getElementById("pst-hoy-min").addEventListener("click", function () {
            hoyCard.classList.toggle("min");
            this.textContent = hoyCard.classList.contains("min") ? "+" : "–";
        });
        function hoyVisible() {
            // Solo en la lista de reflexiones (con sesión iniciada), no mientras se edita
            hoyCard.classList.toggle("on", /^#\/collections\/homilias\/?(\?|$|filter|search)/.test(location.hash) || location.hash === "#/");
        }
        window.addEventListener("hashchange", hoyVisible);
        hoyVisible();

        /* ------------------------------------------------------------------
           Vista previa: usa los estilos reales de la web para que lo que se
           escribe se vea exactamente como saldrá publicado.
           ------------------------------------------------------------------ */
        CMS.registerPreviewStyle("/css/fonts.css");
        CMS.registerPreviewStyle("/css/site.css");
        CMS.registerPreviewStyle([
            "html,body{background:#efe5d2}",
            ".pv{padding:0 0 3rem;font-size:16px}",
            ".pv-label{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.6rem;padding:.7rem 1.2rem;background:#1b1610;color:#f0d79a;font:600 .72rem/1.2 Montserrat,sans-serif;letter-spacing:2.5px;text-transform:uppercase}",
            ".pv-label i{width:8px;height:8px;border-radius:50%;background:#bfa065;display:inline-block}",
            ".pv-hero{position:relative;padding:3.5rem 1.5rem 2.75rem;text-align:center;color:#fff;background:#2a241c url('/fotosdefinitivas/web/portada3.jpg') center 30%/cover}",
            ".pv-hero:before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.4) 45%,rgba(0,0,0,.65))}",
            ".pv-hero>*{position:relative}",
            ".pv-hero h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:2.6rem;line-height:1.1;margin:.6rem 0 .9rem}",
            ".pv .reading{padding:3rem 1.25rem}",
            ".pv .reading-book{padding:3rem 2.75rem 2.5rem}",
            ".pv-body>p:first-of-type::first-letter,.pv-body>div>p:first-of-type::first-letter{float:left;font-family:'UnifrakturMaguntia','Cormorant Garamond',serif;font-size:4.4em;font-weight:400;font-style:normal;line-height:.82;color:#f3dc9a;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),transparent 60%),linear-gradient(135deg,#8a3434,#4b1717);padding:.14em .16em .08em;margin:.06em .16em 0 0;border:2px solid #bfa065;box-shadow:inset 0 0 0 3px #4b1717,inset 0 0 0 4px rgba(233,210,154,.7)}",
            ".pv-body blockquote{position:relative;margin:2.25rem 0;padding:1.6rem 2rem 1.6rem 3.4rem;background:rgba(191,160,101,.1);border-left:3px solid #bfa065;border-radius:0 6px 6px 0;font-family:'Cormorant Garamond',serif;font-size:1.6rem;line-height:1.4;font-style:italic;color:#1a1a1a}",
            ".pv-body blockquote:before{content:'\\201C';position:absolute;left:.9rem;top:.2rem;font-size:4.2rem;line-height:1;color:#bfa065}",
            ".pv-body blockquote p{margin:0;font-size:inherit;line-height:inherit}",
            ".pv-audio{display:flex;align-items:center;justify-content:center;gap:.6rem;max-width:560px;margin:0 auto 2rem;padding:.9rem 1.2rem;background:#fffaf0;border:1px solid #e2d1ad;border-radius:40px;font:600 .74rem Montserrat,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#8f7340}",
            ".pv-empty{color:#9b8f7c;font-style:italic}",
            ".pv-tip{max-width:860px;margin:0 auto 1.5rem;padding:.8rem 1.1rem;background:#fff8e1;border-left:3px solid #e0a800;font:400 .85rem/1.5 Montserrat,sans-serif;color:#6b5400}",
            ".pv-sep{margin:3rem 0 0}",
            ".pv .homily{padding:2.5rem 1.25rem 3rem}",
            ".pv .open-book{transform:scale(.92);transform-origin:top center}",
            ".pv .book-ribbon{right:1rem;height:90px}",
            ".pv .book-right .book-kicker{padding-right:2.2rem}",
            ".pv .book-right .homily-text p{-webkit-line-clamp:8}",
            ".pv-authors{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.5rem;max-width:960px;margin:0 auto;padding:2.5rem 1.25rem}",
            ".pv-author{display:flex;flex-direction:column;align-items:center;text-align:center;padding:2rem 1.25rem;background:#fffaf0;border:1px solid #e2d1ad;box-shadow:0 12px 28px rgba(60,40,10,.1)}",
            ".pv-author .priest-photo{width:130px;height:130px;margin-bottom:1rem}",
            ".pv-author strong{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-style:italic;font-weight:500}",
            ".pv-author span{font:600 .68rem Montserrat,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#8f7340;margin-top:.3rem}",
            ".pv-author code{margin-top:.8rem;font-size:.75rem;color:#9b8f7c}"
        ].join("\n"), { raw: true });

        /* El panel solo expone h y createClass como globales (no React) */
        var h = window.h;
        var createClass = window.createClass;
        var CROSS = h("svg", { viewBox: "0 0 26 34", fill: "none", stroke: "currentColor", strokeLinecap: "round", style: { width: "34%", height: "auto" } },
            h("path", { d: "M13 1.5v31M4.5 10.5h17", strokeWidth: 2 }),
            h("circle", { cx: 13, cy: 10.5, r: 3.4, strokeWidth: 1.3 }));
        var ORNAMENT = h("svg", { className: "ornament", viewBox: "0 0 120 24", fill: "none", stroke: "currentColor" },
            h("path", { d: "M0 12h44M76 12h44", strokeWidth: 1 }),
            h("path", { d: "M60 3v18M53 9.5h14", strokeWidth: 1.4, strokeLinecap: "round" }),
            h("path", { d: "M44 12l4-3 4 3-4 3z", strokeWidth: 1 }),
            h("path", { d: "M68 12l4-3 4 3-4 3z", strokeWidth: 1 }));
        var MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

        function fechaLarga(v) {
            if (!v) return "";
            var d = new Date(v);
            if (isNaN(d)) return String(v);
            return d.getUTCDate() + " de " + MESES[d.getUTCMonth()] + " de " + d.getUTCFullYear();
        }
        function photo(src, cls) {
            return h("div", { className: (cls || "priest-photo") + (src ? "" : " no-photo") },
                src ? h("img", { src: src, alt: "" }) : CROSS);
        }
        /* Personas que escriben: se leen del archivo publicado */
        var autores = {};
        fetch("/contenido/autores.json", { cache: "no-store" }).then(function (r) { return r.json(); })
            .then(function (d) { (d.autores || []).forEach(function (a) { autores[a.id] = a; }); })
            .catch(function () { });

        function firstParagraph(md) {
            var blocks = String(md || "").split(/\n\s*\n/);
            for (var i = 0; i < blocks.length; i++) {
                var b = blocks[i].trim();
                if (b && !/^(#|>|-|\* )/.test(b)) return b.replace(/\*\*|__|\*/g, "").replace(/\n/g, " ");
            }
            return "";
        }
        function firstQuote(md) {
            var m = String(md || "").match(/^>\s*(.+)$/m);
            return m ? m[1].replace(/\*\*|\*/g, "").trim() : "";
        }

        /* ------------------------------------------------------------------
           Vista previa de una reflexión
           ------------------------------------------------------------------ */
        var HomilyPreview = createClass({
            render: function () {
                var e = this.props.entry, get = function (k) { return e.getIn(["data", k]); };
                var a = autores[get("autor")] || {};
                var nombre = a.nombre || get("autor") || "";
                var foto = a.foto ? (a.foto.charAt(0) === "/" ? a.foto : "/" + a.foto) : "";
                var kicker = get("tiempo") || fechaLarga(get("fecha"));
                var titulo = get("titulo") || "";
                var texto = get("texto") || "";
                var quote = firstQuote(texto);
                var tips = [];
                if (!titulo) tips.push("Falta el título.");
                if (!get("autor")) tips.push("Elige quién la escribe en «Escrita por».");
                if (!texto) tips.push("Pega o escribe el texto de la reflexión.");
                if (/\[(Escribe|Cita del Evangelio|Frase del Evangelio)/.test(titulo + texto))
                    tips.push("Aún quedan huecos [entre corchetes] de la plantilla: rellénalos o bórralos. Mientras estén, la reflexión no saldrá en la web.");
                if (get("publicado") === false) tips.push("Está marcada como borrador: no aparecerá en la web hasta activar «Publicada».");

                return h("div", { className: "pv" },
                    h("div", { className: "pv-label" }, h("i"), "Así se verá la reflexión en la web"),
                    h("section", { className: "pv-hero" },
                        h("span", { className: "eyebrow" }, kicker || "Tiempo litúrgico o fecha"),
                        h("h1", null, titulo || "Título de la reflexión"),
                        h("div", { className: "hero-divider" })),
                    h("section", { className: "reading" },
                        tips.length ? h("div", { className: "pv-tip" }, tips.join(" ")) : null,
                        h("div", { className: "reading-wrap" },
                            h("div", { className: "reading-author" },
                                photo(foto),
                                h("div", { className: "reading-author-text" },
                                    h("span", { className: "book-kicker" }, a.cargo || ""),
                                    h("strong", null, nombre || h("span", { className: "pv-empty" }, "Autor")))),
                            get("audio") ? h("div", { className: "pv-audio" }, "🎧 Audio de SoundCloud enlazado") : null,
                            h("article", { className: "prose book-page reading-book" },
                                h("span", { className: "book-kicker" }, kicker),
                                h("h2", { className: "reading-title" }, titulo || "Título de la reflexión"),
                                ORNAMENT,
                                get("saludo") ? h("p", { className: "lead" }, get("saludo")) : null,
                                h("div", { className: "pv-body" },
                                    texto ? this.props.widgetFor("texto") : h("p", { className: "pv-empty" }, "Aquí aparecerá el texto…")),
                                nombre ? h("p", { className: "firma" }, nombre) : null))),

                    h("div", { className: "pv-label pv-sep" }, h("i"), "Y así en la portada, si es la más reciente"),
                    h("section", { className: "homily" },
                        h("div", { className: "open-book" },
                            h("span", { className: "book-ribbon" }),
                            h("div", { className: "book-leaf book-left" },
                                photo(foto),
                                h("strong", { className: "book-author" }, nombre || "Autor"),
                                h("span", { className: "book-role" }, a.cargo || ""),
                                ORNAMENT,
                                quote ? h("blockquote", { className: "book-quote" }, h("span", null, "“"), quote)
                                      : h("p", { className: "pv-empty", style: { fontSize: ".85rem" } }, "Consejo: marca una frase como «Cita» para que aparezca aquí destacada."),
                                h("span", { className: "btn btn-solid" }, "Leer la reflexión completa")),
                            h("div", { className: "book-leaf book-right" },
                                h("article", { className: "homily-text" },
                                    h("span", { className: "book-kicker" }, kicker),
                                    h("h3", null, titulo || "Título de la reflexión"),
                                    h("p", { className: "illuminated" }, firstParagraph(texto) || "…")),
                                h("span", { className: "link-arrow book-more" }, "Seguir leyendo →")))));
            }
        });
        CMS.registerPreviewTemplate("homilias", HomilyPreview);

        /* ------------------------------------------------------------------
           Vista previa de las personas que escriben
           ------------------------------------------------------------------ */
        var AuthorsPreview = createClass({
            render: function () {
                var list = this.props.entry.getIn(["data", "autores"]);
                var self = this;
                var items = list ? list.toArray() : [];
                return h("div", { className: "pv" },
                    h("div", { className: "pv-label" }, h("i"), "Así aparecen las personas en la web"),
                    h("div", { className: "pv-authors" }, items.map(function (it, i) {
                        var foto = it.get("foto");
                        var asset = foto ? self.props.getAsset(foto) : null;
                        return h("div", { className: "pv-author", key: i },
                            photo(asset ? asset.toString() : ""),
                            h("strong", null, it.get("nombre") || "Nombre"),
                            h("span", null, it.get("cargo") || ""),
                            h("code", null, it.get("id") || "identificador"));
                    })));
            }
        });
        CMS.registerPreviewTemplate("autores", AuthorsPreview);
    })();
    </script>
</body>
</html>
