# Panel de homilías (Decap CMS)
# Cada homilía se guarda como archivo en contenido/homilias/ del repositorio de GitHub.
# Al publicar, Netlify vuelve a generar la web y la reflexión aparece sola en la portada,
# en el menú y en el archivo.

# ---------------------------------------------------------------------------
# ACCESO CON CORREO Y CONTRASEÑA (DecapBridge, sin cuenta de GitHub)
# Los usuarios se invitan y gestionan en https://decapbridge.com
# ---------------------------------------------------------------------------
backend:
  name: git-gateway
  repo: dannymedinacoronel/parroquiasantateresabcn.org
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/e9b3b04d-42f3-47d2-9041-343f719e4de5/pkce
  auth_token_endpoint: /sites/e9b3b04d-42f3-47d2-9041-343f719e4de5/token
  gateway_url: https://gateway.decapbridge.com
  # Quién hizo cada cambio queda guardado en el historial de GitHub
  commit_messages:
    create: "Nueva reflexión «{{slug}}» - {{author-name}} <{{author-login}}> vía DecapBridge"
    update: "Reflexión actualizada «{{slug}}» - {{author-name}} <{{author-login}}> vía DecapBridge"
    delete: "Reflexión eliminada «{{slug}}» - {{author-name}} <{{author-login}}> vía DecapBridge"
    uploadMedia: "Foto subida «{{path}}» - {{author-name}} <{{author-login}}> vía DecapBridge"
    deleteMedia: "Foto eliminada «{{path}}» - {{author-name}} <{{author-login}}> vía DecapBridge"
    openAuthoring: "{{message}} - {{author-name}} <{{author-login}}> vía DecapBridge"

# Datos del usuario que inicia sesión (nombre, correo y foto en el panel)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

locale: es
# Mientras el dominio propio no apunte a Netlify, los enlaces del panel van a la web publicada en Netlify.
# Cuando www.parroquiasantateresabcn.org esté conectado, cambia estas dos líneas a ese dominio.
site_url: https://parroquiasantateresabcn.netlify.app
display_url: https://parroquiasantateresabcn.netlify.app
logo_url: /favicon-512.png
publish_mode: simple
# Direcciones de las reflexiones sin acentos ni eñes (más fáciles de compartir)
slug:
  encoding: ascii
  clean_accents: true

media_folder: fotosdefinitivas/web/autores
public_folder: /fotosdefinitivas/web/autores

collections:
  - name: homilias
    label: Homilías y reflexiones
    label_singular: Reflexión
    description: >
      Escribe o pega el texto de la reflexión, elige quién la firma y pulsa «Publicar».
      En unos minutos aparecerá en la portada de la web, en el menú y en el archivo.
    folder: contenido/homilias
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{fecha}}-{{titulo}}"
    identifier_field: titulo
    summary: "{{fecha}} · {{titulo}} — {{autor}}"
    preview_path: "html/reflexiones/{{slug}}.html"
    sortable_fields: ["fecha", "titulo"]
    view_filters:
      - { label: "Publicadas", field: publicado, pattern: true }
      - { label: "Borradores", field: publicado, pattern: false }
    fields:
      - label: Título
        name: titulo
        widget: string
        hint: "Ej.: Remar mar adentro"
      - label: Escrita por
        name: autor
        widget: relation
        collection: ajustes
        file: autores
        search_fields: ["autores.*.nombre"]
        display_fields: ["autores.*.nombre"]
        value_field: "autores.*.id"
        hint: "Si la persona no aparece, añádela antes en «Personas que escriben»."
      - label: Fecha
        name: fecha
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        picker_utc: true
        default: "{{now}}"
        hint: "Se rellena con el día de hoy. La reflexión con la fecha más reciente es la que sale primera en la portada y en el archivo."
      - label: Tiempo litúrgico
        name: tiempo
        widget: string
        required: false
        hint: "Aparece encima del título. Ej.: III domingo de Pascua · 2026. Si lo dejas vacío se muestra la fecha."
      - label: Saludo inicial
        name: saludo
        widget: string
        required: false
        hint: "Ej.: Queridos/as amigos/as:"
      - label: Texto de la reflexión
        name: texto
        widget: markdown
        buttons: ["bold", "italic", "heading-three", "quote", "bulleted-list"]
        editor_components: []
        modes: ["rich_text", "raw"]
        hint: >
          Pega el texto. Separa los párrafos con una línea en blanco. La primera letra del primer
          párrafo se mostrará como letra capitular. Usa «Cita» para destacar una frase en grande
          y «Subtítulo» (H3) para los apartados.
      - label: Audio de SoundCloud
        name: audio
        widget: string
        required: false
        hint: "Pega el enlace de la pista de SoundCloud (https://soundcloud.com/...)."
      - label: Enlace a la presentación
        name: presentacion
        widget: string
        required: false
        hint: "Por ejemplo, una carpeta de Google Drive."
      - label: Publicada
        name: publicado
        widget: boolean
        default: true
        hint: "Desactívalo para guardarla como borrador sin que aparezca en la web."

  - name: ajustes
    label: Personas que escriben
    files:
      - name: autores
        label: Autores de las reflexiones
        file: contenido/autores.json
        format: json
        fields:
          - label: Personas
            name: autores
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - label: Identificador
                name: id
                widget: string
                hint: "En minúsculas y sin espacios, p. ej. «maria-garcia». No lo cambies después de usarlo."
              - label: Nombre que se muestra
                name: nombre
                widget: string
              - label: Cargo o relación con la parroquia
                name: cargo
                widget: string
                required: false
                hint: "Ej.: Rector de nuestra parroquia · Feligresa · Catequista"
              - label: Foto
                name: foto
                widget: image
                required: false
                hint: "Mejor una foto cuadrada de la cara. Si no hay foto se muestra la cruz de la parroquia."
              # Huella (SHA-256) del correo con el que la persona entra al panel: así el panel la
              # reconoce, muestra su foto y firma por ella las reflexiones nuevas. No es el correo.
              - label: Acceso al panel
                name: acceso
                widget: hidden
                required: false
