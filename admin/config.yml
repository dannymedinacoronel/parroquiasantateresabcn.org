# Panel de homilías (Decap CMS)
# Cada homilía se guarda como archivo en contenido/homilias/ del repositorio de GitHub.
# Al publicar, Netlify vuelve a generar la web y la reflexión aparece sola en la portada,
# en el menú y en el archivo.

# ---------------------------------------------------------------------------
# ACCESO CON CORREO Y CONTRASEÑA (DecapBridge, sin cuenta de GitHub)
# Los usuarios se invitan y gestionan en https://decapbridge.com
# ---------------------------------------------------------------------------
backend:
  name: git-gateway
  repo: dannymedinacoronel/parroquiasantateresabcn.org
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/e9b3b04d-42f3-47d2-9041-343f719e4de5/pkce
  auth_token_endpoint: /sites/e9b3b04d-42f3-47d2-9041-343f719e4de5/token
  gateway_url: https://gateway.decapbridge.com
  # Quién hizo cada cambio queda guardado en el historial de GitHub
  commit_messages:
    create: "Nueva reflexión «{{slug}}» - {{author-name}} <{{author-login}}> vía DecapBridge"
    update: "Reflexión actualizada «{{slug}}» - {{author-name}} <{{author-login}}> vía DecapBridge"
    delete: "Reflexión eliminada «{{slug}}» - {{author-name}} <{{author-login}}> vía DecapBridge"
    uploadMedia: "Foto subida «{{path}}» - {{author-name}} <{{author-login}}> vía DecapBridge"
    deleteMedia: "Foto eliminada «{{path}}» - {{author-name}} <{{author-login}}> vía DecapBridge"
    openAuthoring: "{{message}} - {{author-name}} <{{author-login}}> vía DecapBridge"

# Datos del usuario que inicia sesión (nombre, correo y foto en el panel)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

locale: es
# Mientras el dominio propio no apunte a Netlify, los enlaces del panel van a la web publicada en Netlify.
# Cuando www.parroquiasantateresabcn.org esté conectado, cambia estas dos líneas a ese dominio.
site_url: https://parroquiasantateresabcn.netlify.app
display_url: https://parroquiasantateresabcn.netlify.app
logo_url: /favicon-512.png
publish_mode: simple
# Direcciones de las reflexiones sin acentos ni eñes (más fáciles de compartir)
slug:
  encoding: ascii
  clean_accents: true

media_folder: fotosdefinitivas/web/autores
public_folder: /fotosdefinitivas/web/autores

collections:
  - name: homilias
    label: Homilías y reflexiones
    label_singular: Reflexión
    description: >
      Escribe o pega el texto de la reflexión, elige quién la firma y pulsa «Publicar».
      En unos minutos aparecerá en la portada de la web, en el menú y en el archivo.
    folder: contenido/homilias
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{fecha}}-{{titulo}}"
    identifier_field: titulo
    summary: "{{fecha}} · {{titulo}} — {{autor}}"
    preview_path: "html/reflexiones/{{slug}}.html"
    sortable_fields: ["fecha", "titulo"]
    view_filters:
      - { label: "Publicadas", field: publicado, pattern: true }
      - { label: "Borradores", field: publicado, pattern: false }
    fields:
      - label: Título
        name: titulo
        widget: string
        hint: "Ej.: Remar mar adentro"
      - label: Escrita por
        name: autor
        widget: relation
        collection: ajustes
        file: autores
        search_fields: ["autores.*.nombre"]
        display_fields: ["autores.*.nombre"]
        value_field: "autores.*.id"
        hint: "Si la persona no aparece, añádela antes en «Personas que escriben»."
      - label: Fecha
        name: fecha
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        picker_utc: true
        default: "{{now}}"
        hint: "Se rellena con el día de hoy. La reflexión con la fecha más reciente es la que sale primera en la portada y en el archivo."
      - label: Tiempo litúrgico
        name: tiempo
        widget: string
        required: false
        hint: "Aparece encima del título. Ej.: III domingo de Pascua · 2026. Si lo dejas vacío se muestra la fecha."
      - label: Saludo inicial
        name: saludo
        widget: string
        required: false
        hint: "Ej.: Queridos/as amigos/as:"
      - label: Texto de la reflexión
        name: texto
        widget: markdown
        buttons: ["bold", "italic", "heading-three", "quote", "bulleted-list"]
        editor_components: []
        modes: ["rich_text", "raw"]
        hint: >
          Pega el texto. Separa los párrafos con una línea en blanco. La primera letra del primer
          párrafo se mostrará como letra capitular. Usa «Cita» para destacar una frase en grande
          y «Subtítulo» (H3) para los apartados.
      - label: Audio de SoundCloud
        name: audio
        widget: string
        required: false
        hint: "Pega el enlace de la pista de SoundCloud (https://soundcloud.com/...)."
      - label: Enlace a la presentación
        name: presentacion
        widget: string
        required: false
        hint: "Por ejemplo, una carpeta de Google Drive."
      - label: Publicada
        name: publicado
        widget: boolean
        default: true
        hint: "Desactívalo para guardarla como borrador sin que aparezca en la web."

  # ---------------------------------------------------------------------------
  # REVISTA DIGITAL
  # Cada número es una entrada; cada artículo, otra (así varias personas pueden escribir a la
  # vez sin pisarse). Un número no sale en la web hasta que se marca «Publicado».
  # Páginas que se generan: html/revista.html, html/revista/<número>.html y una por artículo.
  # ---------------------------------------------------------------------------
  - name: revista_numeros
    label: "Revista · Números"
    label_singular: "número de la revista"
    description: >
      Cada número de la revista: portada, presentación y, si la revista también está en PDF, el archivo.
      Mientras no actives «Publicado» es un borrador y no se ve en la web. Los artículos se escriben
      en «Revista · Artículos»; desde la vista previa de un número puedes añadirle artículos.
    folder: contenido/revista/numeros
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{numero}}-{{titulo}}"
    identifier_field: titulo
    summary: "Nº {{numero}} · {{titulo}} ({{publicado | ternary('publicado', 'borrador')}})"
    preview_path: "html/revista/{{slug}}.html"
    sortable_fields: ["numero", "fecha", "titulo"]
    media_folder: /fotosdefinitivas/web/revista
    public_folder: /fotosdefinitivas/web/revista
    view_filters:
      - { label: "Publicados", field: publicado, pattern: true }
      - { label: "Borradores", field: publicado, pattern: false }
    fields:
      - label: Número
        name: numero
        widget: number
        value_type: int
        min: 1
        hint: "1 para el primero, 2 para el segundo… Sale en la portada como «Número 1»."
      - label: Título
        name: titulo
        widget: string
        hint: "Ej.: «Adviento 2026» o «Fiesta de Santa Teresa»."
      - label: Fecha de publicación
        name: fecha
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        picker_utc: true
        default: "{{now}}"
        hint: "El número con la fecha más reciente es el que sale en la portada de la web."
      - label: Portada
        name: portada
        widget: image
        required: false
        hint: "Mejor en vertical. Si no pones ninguna, se usa una foto de la parroquia."
      - label: La imagen ya es la portada completa (con su título)
        name: portada_completa
        widget: boolean
        default: false
        required: false
        hint: "Actívalo si subes la portada ya diseñada (por ejemplo, hecha en Canva). Si está desactivado, la web le pone encima «Santa Teresa» y el número."
      - label: Presentación
        name: presentacion
        widget: markdown
        buttons: ["bold", "italic", "heading-three", "quote", "bulleted-list"]
        editor_components: []
        modes: ["rich_text", "raw"]
        required: false
        hint: "Unas líneas de bienvenida al número. El primer párrafo sale también en la portada de la web."
      - label: Revista en PDF
        name: pdf
        widget: file
        required: false
        hint: "Solo si la revista también está maquetada en PDF. Procura que no pase de 15 MB para que cargue bien en el móvil."
      - label: Enlace a la revista
        name: enlace
        widget: string
        required: false
        hint: "Si la revista está en Issuu, Calameo, Canva u otra web, pega aquí su dirección (empieza por https://)."
      - label: Publicado
        name: publicado
        widget: boolean
        default: false
        hint: "Actívalo cuando el número esté listo: entonces sale en la web con todos sus artículos terminados."

  - name: revista_articulos
    label: "Revista · Artículos"
    label_singular: "artículo de la revista"
    description: >
      Cada artículo de la revista. Elige a qué número pertenece y escríbelo; saldrá en la web en
      cuanto ese número esté publicado. El orden decide en qué posición aparece en el índice.
    folder: contenido/revista/articulos
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{titulo}}"
    identifier_field: titulo
    summary: "{{titulo}} — {{autor}}"
    preview_path: "html/revista/{{numero}}--{{slug}}.html"
    sortable_fields: ["numero", "orden", "titulo"]
    view_groups:
      - { label: "Número", field: numero }
    media_folder: /fotosdefinitivas/web/revista
    public_folder: /fotosdefinitivas/web/revista
    fields:
      - label: Número de la revista
        name: numero
        widget: relation
        collection: revista_numeros
        value_field: "{{slug}}"
        search_fields: ["titulo", "numero"]
        display_fields: ["titulo"]
        hint: "Si el número aún no existe, créalo antes en «Revista · Números» (puede quedarse como borrador)."
      - label: Sección
        name: seccion
        widget: select
        required: false
        options: ["Editorial", "Vida parroquial", "Entrevista", "Liturgia", "Catequesis", "Jóvenes", "Cáritas", "Testimonio", "Historia", "Opinión", "Agenda"]
        hint: "Sale encima del título."
      - label: Título
        name: titulo
        widget: string
      - label: Firma
        name: autor
        widget: string
        required: false
        hint: "Quién lo escribe. Ej.: «Mn. Albert Sols», «Magdalena» o «Grupo de jóvenes»."
      - label: Entradilla
        name: entradilla
        widget: text
        required: false
        hint: "Una o dos frases que resumen el artículo. Salen en el índice del número y al compartir el enlace."
      - label: Foto
        name: foto
        widget: image
        required: false
        hint: "Si sale gente reconocible, asegúrate de tener su permiso (y el de los padres si son menores)."
      - label: Pie de foto
        name: pie
        widget: string
        required: false
      - label: Texto
        name: texto
        widget: markdown
        buttons: ["bold", "italic", "heading-three", "quote", "bulleted-list"]
        editor_components: []
        modes: ["rich_text", "raw"]
        hint: >
          Separa los párrafos con una línea en blanco. Usa «Subtítulo» (H3) para los apartados y
          «Cita» para destacar una frase en grande.
      - label: Orden en el número
        name: orden
        widget: number
        value_type: int
        min: 1
        default: 10
        required: false
        hint: "Los artículos se ordenan de menor a mayor: el 1 sale el primero (por ejemplo, la editorial)."
      - label: Listo para publicar
        name: publicado
        widget: boolean
        default: true
        hint: "Desactívalo si aún no está terminado: no saldrá en la web aunque su número esté publicado."

  # Recuadro de la revista en la portada mientras no haya ningún número publicado («Próximamente»).
  # En cuanto se publica un número, la portada muestra ese número automáticamente.
  - name: revista
    label: "Revista · Recuadro de la portada"
    description: "Lo que se ve en la portada de la web mientras aún no hay ningún número publicado. En cuanto publiques uno, la portada mostrará ese número automáticamente."
    files:
      - name: revista
        label: Recuadro «Próximamente» de la portada
        file: contenido/revista.json
        format: json
        fields:
          - label: Mostrar en la portada
            name: mostrar
            widget: boolean
            default: true
            hint: "Desactívalo para ocultar el recuadro mientras no haya números publicados."
          - { label: Título, name: titulo, widget: string, default: "Revista digital de la Parroquia" }
          - label: Texto
            name: texto
            widget: text
            hint: "Unas pocas líneas. Deja una línea en blanco para empezar otro párrafo."
          - label: Número o edición
            name: numero
            widget: string
            required: false
            hint: "Sale en la portada dibujada, p. ej. «Número 1» o «Adviento 2026»."
          - label: Imagen de portada
            name: portada
            widget: image
            required: false
            media_folder: /fotosdefinitivas/web/revista
            public_folder: /fotosdefinitivas/web/revista
            hint: "Mejor en vertical (como una revista). Si no pones ninguna, se usa una foto de la parroquia."
          - label: Traducciones al catalán y al inglés
            name: traducciones
            widget: object
            collapsed: true
            required: false
            hint: "Si las dejas vacías, la web en catalán y en inglés muestra el texto en castellano."
            fields:
              - { label: Título en catalán, name: titulo_ca, widget: string, required: false }
              - { label: Texto en catalán, name: texto_ca, widget: text, required: false }
              - { label: Título en inglés, name: titulo_en, widget: string, required: false }
              - { label: Texto en inglés, name: texto_en, widget: text, required: false }

  - name: ajustes
    label: Personas que escriben
    files:
      - name: autores
        label: Autores de las reflexiones
        file: contenido/autores.json
        format: json
        fields:
          - label: Personas
            name: autores
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - label: Identificador
                name: id
                widget: string
                hint: "En minúsculas y sin espacios, p. ej. «maria-garcia». No lo cambies después de usarlo."
              - label: Nombre que se muestra
                name: nombre
                widget: string
              - label: Cargo o relación con la parroquia
                name: cargo
                widget: string
                required: false
                hint: "Ej.: Rector de nuestra parroquia · Feligresa · Catequista"
              - label: Foto
                name: foto
                widget: image
                required: false
                hint: "Mejor una foto cuadrada de la cara. Si no hay foto se muestra la cruz de la parroquia."
              - label: Color
                name: color
                widget: color
                required: false
                hint: "Color propio de la persona: marca sus reflexiones en la web y sus tareas en el panel."
              # Huella (SHA-256) del correo con el que la persona entra al panel: así el panel la
              # reconoce, muestra su foto y firma por ella las reflexiones nuevas. No es el correo.
              - label: Acceso al panel
                name: acceso
                widget: hidden
                required: false
