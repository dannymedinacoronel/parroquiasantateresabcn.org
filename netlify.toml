# --- Cabeceras de seguridad ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# --- Caché ---
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fotosdefinitivas/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Las noticias cambian dos veces al día
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=1800, must-revalidate"

# Horario de misas para añadir al calendario del móvil (página Eucaristías)
[[headers]]
  for = "/data/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "attachment; filename=\"parroquia-santa-teresa-horarios.ics\""

# Herramientas internas: no se publican
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Código de las funciones de métricas (se ejecutan en /api/form-event y /api/form-stats)
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Las tareas del equipo no son públicas: el dashboard las lee con el acceso del panel
[[redirects]]
  from = "/contenido/tareas.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true
