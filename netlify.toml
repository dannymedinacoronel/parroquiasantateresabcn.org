# Configuración de Netlify para parroquiasantateresabcn.org
# Web estática: no hay paso de compilación, se publica la raíz del repositorio tal cual.

[build]
  publish = "."
  # En cada publicación: descarga las noticias del día y genera todas las páginas
  # (incluidas las homilías subidas desde /admin/). Si la descarga de noticias
  # falla, se conservan las anteriores y la web se genera igualmente.
  command = "python3 scripts/actualizar_noticias.py; python3 scripts/generador/generar_web.py ."
  # Si en un cambio solo se han tocado las tareas del equipo, no hace falta volver a generar la web
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)contenido/tareas.json'"

[build.environment]
  PYTHON_VERSION = "3.12"

# --- Direcciones antiguas -> nuevas (301 conserva el posicionamiento en Google) ---
# El menú antiguo enlazaba a /HTML/ en mayúsculas
[[redirects]]
  from = "/HTML/*"
  to = "/html/:splat"
  status = 301

