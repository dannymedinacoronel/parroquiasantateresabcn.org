        <section{{#ancla}} id="{{ancla}}"{{/ancla}}{{#fondo}} class="{{fondo}}"{{/fondo}}>
            <div class="section-head">{{#antetitulo}}
                <span class="subtitulo" data-f="antetitulo">{{antetitulo}}</span>{{/antetitulo}}
                <h2 data-f="titulo">{{titulo}}</h2>
                <hr class="section-divider" style="margin-bottom:{{#entradilla}}1.25rem{{/entradilla}}{{^entradilla}}0{{/entradilla}};">{{#entradilla}}
                <p data-f="entradilla">{{entradilla}}</p>{{/entradilla}}
            </div>
            <div class="feature-grid">{{#tarjetas}}
                <a class="feature" href="{{enlace|url}}">
                    <img data-f="tarjetas.{{@i}}.foto" src="{{foto|img}}" alt="{{titulo}}" loading="lazy">
                    <div class="feature-body">
                        <span class="subtitulo" data-f="tarjetas.{{@i}}.antetitulo">{{antetitulo}}</span>
                        <h3 data-f="tarjetas.{{@i}}.titulo">{{titulo}}</h3>
                        <p data-f="tarjetas.{{@i}}.texto">{{texto}}</p>
                    </div>
                </a>{{/tarjetas}}
            </div>{{#boton_texto}}
            <div class="btn-group center" style="margin-top:3rem;">
                <a href="{{boton_enlace|url}}" class="btn">{{boton_texto}}</a>
            </div>{{/boton_texto}}
        </section>
